name: "Feature request / 功能願望"
description: "Suggest a useful improvement for MediaRoam / 建議 MediaRoam 改善功能"
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your idea. 感謝提供想法。

        MediaRoam prioritizes free, private, fast, and reliable features. MediaRoam 優先考慮免費、隱私、快速與穩定。
  - type: dropdown
    id: language
    attributes:
      label: "Reply language / 回覆語言"
      options:
        - "繁體中文"
        - "简体中文"
        - "English"
        - "日本語"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What problem should this solve? / 想解決什麼問題？"
      description: "Describe the situation, not private account or file details. 請描述情境，不要提供私人帳號或檔案內容。"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "Suggested experience / 希望如何操作？"
      placeholder: "Describe the shortest, clearest workflow you expect. / 請描述你期待的簡單操作流程。"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: "Platform / 平台"
      options:
        - "All Apple devices / 全部 Apple 裝置"
        - "iPhone"
        - "iPad"
        - "Apple TV"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "Impact / 影響程度"
      options:
        - "Blocks normal use / 無法正常使用"
        - "Saves significant time / 可省很多時間"
        - "Convenience improvement / 操作更方便"
        - "Nice to have / 有更好"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy check / 隱私確認"
      options:
        - label: "I did not include passwords, tokens, IP addresses, full paths, or private media. / 我未提供密碼、Token、IP、完整路徑或私人檔案。"
          required: true
